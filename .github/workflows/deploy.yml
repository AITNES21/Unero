name: Construir y publicar en GitHub Pages

# Se ejecuta al empujar a main (incluidos los commits que hace el CMS
# al guardar contenido) y también a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos necesarios para publicar en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos commits seguidos, se cancela el despliegue en curso
# y solo se publica el último. Evita carreras entre dos builds.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    name: Construir
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir el sitio
        run: npm run build

      - name: Auditar el resultado
        # Comprueba enlaces roto, metadatos duplicados, imágenes sin alt
        # y cobertura del sitemap. Si algo falla, el despliegue se detiene
        # antes de publicar: es más barato romper el build que la web.
        run: node scripts/auditar.mjs

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
